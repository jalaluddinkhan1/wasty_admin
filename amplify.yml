version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --ignore-scripts
    build:
      commands:
        - env | grep -e WASTY_ -e NEXT_PUBLIC_ -e FIREBASE_ADMIN_ | sed 's/=.*$/=***/' || true
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
